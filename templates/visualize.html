{% extends "base.html" %}
{% block title %}Visualize Attack Logs{% endblock %}
{% block content %}
<h1>Attack Logs Visualization</h1>
{% if has_data %}
<img src="{{ plot_url }}" alt="Attack Analysis" class="img-fluid">
<p class="mt-3">Total attacks: {{ total_attacks }}. Refresh after new attacks.</p>
{% else %}
<div class="alert alert-warning">{{ message }}</div>
{% endif %}
{% endblock %}
